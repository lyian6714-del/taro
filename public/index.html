<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Tarot | 命运之轮</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars-bg"></div>
    <main class="container">
        <header>
            <h1 class="glow-text">Mystic Tarot</h1>
            <p class="subtitle">凝神静气，点击洗牌，凭直觉抽取三张命运之牌</p>
        </header>

        <section class="inquiry-area">
            <div class="input-wrapper">
                <input type="text" id="question-input" class="mystic-input" placeholder="在心中默念你的问题，并在此写下..." autocomplete="off">
                <div class="input-glow"></div>
            </div>
        </section>

        <div class="controls">
            <button id="shuffle-btn" class="gold-btn">洗牌并展牌 (Shuffle & Spread)</button>
        </div>

        <section id="spread-area" class="spread-container hidden"></section>

        <section id="reading-results" class="results-area hidden"></section>
    </main>
    <script src="app.js"></script>
</body>
</html>
